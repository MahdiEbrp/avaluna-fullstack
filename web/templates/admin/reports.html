{{define "content"}}
<div class="grid gap-5 lg:grid-cols-[280px_1fr]">
  <aside class="card h-fit p-3">
    <div class="px-3 py-2 text-[10px] font-bold uppercase tracking-widest text-slate-400">{{.T "admin.reports"}} (20)</div>
    <nav class="space-y-0.5">
      {{range .Reports}}
      <a href="/admin/reports?key={{.Key}}" class="block rounded-lg px-3 py-2 text-xs font-medium {{if .Active}}bg-cyan-700 text-white{{else}}text-slate-600 hover:bg-slate-100{{end}}">{{.Title}}</a>
      {{end}}
    </nav>
  </aside>

  <div class="card overflow-hidden">
    <div class="flex flex-wrap items-center gap-3 border-b border-slate-100 px-5 py-3.5">
      <h2 class="flex-1 text-base">{{.Heading}}</h2>
      <form method="get" class="flex items-center gap-2">
        <input type="hidden" name="key" value="{{.Key}}">
        <input type="date" name="from" value="{{.From}}" class="input w-40 py-1.5 text-xs">
        <input type="date" name="to" value="{{.To}}" class="input w-40 py-1.5 text-xs">
        <button class="btn-ghost btn-sm">{{.T "common.apply"}}</button>
      </form>
      <a class="btn-ghost btn-sm" href="/api/v1/admin/reports/{{.Key}}/export?from={{.From}}&to={{.To}}">⬇ CSV</a>
    </div>
    <p class="border-b border-slate-100 bg-slate-50 px-5 py-2.5 text-xs text-slate-500">{{.Description}}</p>
    <div class="overflow-x-auto">
      <table class="table">
        <thead><tr>{{range .Columns}}<th>{{.}}</th>{{end}}</tr></thead>
        <tbody>
          {{range .Rows}}
          <tr>{{range .}}<td class="whitespace-nowrap text-xs">{{.}}</td>{{end}}</tr>
          {{else}}
          <tr><td colspan="99" class="py-16 text-center text-sm text-slate-400">{{$.T "common.empty"}}</td></tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>
</div>
{{end}}
