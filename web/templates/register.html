{{define "content"}}
<div class="container-x grid place-items-center py-16">
  <div class="w-full max-w-md card p-8">
    <h1 class="text-xl">{{.T "auth.register.title"}}</h1>
    <form method="post" action="/register" class="mt-6 space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="label">{{.T "common.name"}}</label><input name="firstName" class="input" required></div>
        <div><label class="label">&nbsp;</label><input name="lastName" class="input"></div>
      </div>
      <div><label class="label">{{.T "common.email"}}</label><input name="email" type="email" class="input" required></div>
      <div><label class="label">{{.T "common.phone"}}</label><input name="phone" class="input"></div>
      <div><label class="label">{{.T "common.password"}}</label><input name="password" type="password" class="input" minlength="8" required></div>
      <div><label class="label">{{.T "account.referral"}} <span class="font-normal text-slate-400">({{.T "common.optional"}})</span></label><input name="referral" value="{{.Referral}}" class="input"></div>
      {{if .Error}}<p class="rounded-lg bg-rose-50 p-2.5 text-xs text-rose-700">{{.Error}}</p>{{end}}
      <button class="btn-primary w-full">{{.T "common.submit"}}</button>
    </form>
    <p class="mt-5 text-center text-xs text-slate-500">
      <a class="text-cyan-700 hover:underline" href="/login">{{.T "nav.login"}}</a>
    </p>
  </div>
</div>
{{end}}
