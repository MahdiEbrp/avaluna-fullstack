{{define "content"}}
<article class="container-x py-10">
  <div class="mx-auto max-w-3xl">
    <nav class="mb-4 text-xs text-slate-400">
      <a class="hover:text-cyan-700" href="/blog">{{.T "nav.blog"}}</a> / <span class="text-slate-600">{{.Post.title}}</span>
    </nav>
    <h1 class="text-3xl leading-relaxed">{{.Post.title}}</h1>
    <div class="mt-3 flex flex-wrap gap-3 text-xs text-slate-500">
      <span>{{.Post.date}}</span><span>·</span><span>👁 {{.Post.views}}</span>
      {{if .Post.tags}}<span>·</span><span>{{.Post.tags}}</span>{{end}}
    </div>
    <div class="card mt-6 p-7">
      <div class="prose-rtl text-sm">{{.Body}}</div>
    </div>

    <section class="card mt-6 p-6">
      <h2 class="mb-4 text-base">{{.T "product.reviews"}}</h2>
      <div class="space-y-3">
        {{range .Comments}}
        <div class="rounded-xl bg-slate-50 p-3">
          <div class="text-xs font-semibold text-slate-700">{{.author}}</div>
          <p class="mt-1 text-xs leading-6 text-slate-500">{{.body}}</p>
        </div>
        {{else}}<p class="text-sm text-slate-500">{{.T "common.empty"}}</p>{{end}}
      </div>
      {{if .User}}
      <form class="mt-5 grid gap-2" hx-post="/blog/{{.Post.slug}}/comment" hx-target="#comment-result" hx-swap="innerHTML">
        <textarea name="body" rows="3" class="input" placeholder="{{.T `common.description`}}" required></textarea>
        <button class="btn-primary">{{.T "common.submit"}}</button>
      </form>
      <div id="comment-result" class="mt-2 text-sm"></div>
      {{end}}
    </section>
  </div>
</article>
{{end}}
