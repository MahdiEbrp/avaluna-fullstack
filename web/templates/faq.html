{{define "content"}}
<div class="container-x py-10">
  <div class="mx-auto max-w-3xl">
    <h1 class="mb-6 text-2xl">{{.T "nav.faq"}}</h1>
    <div class="space-y-3">
      {{range .FAQs}}
      <details class="card group p-5">
        <summary class="cursor-pointer list-none text-sm font-semibold text-slate-800 marker:hidden">
          <span class="me-2 text-cyan-700">▸</span>{{.question}}
        </summary>
        <p class="mt-3 ps-5 text-sm leading-7 text-slate-600">{{.answer}}</p>
      </details>
      {{end}}
    </div>
  </div>
</div>
{{end}}
